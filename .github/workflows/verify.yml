name: Verify scripts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v5 tag resolved on 2026-06-01 for supply-chain reproducibility.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run strict script verification
        run: bash scripts/verify-scripts.sh
