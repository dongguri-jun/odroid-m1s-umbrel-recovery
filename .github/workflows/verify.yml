name: Verify scripts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v5 tag resolved on 2026-06-01 for supply-chain reproducibility.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install ShellCheck
        shell: bash
        run: |
          shellcheck_version="$(<.shellcheck-version)"
          archive="shellcheck-v${shellcheck_version}.linux.x86_64.tar.xz"
          curl -fsSLo "/tmp/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${shellcheck_version}/${archive}"
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${shellcheck_version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run strict script verification
        run: bash scripts/verify-scripts.sh
